name: CI/CD Pipeline - streams-api

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-package:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and Test
        run: mvn clean install
        working-directory: streams

      - name: Package JAR
        run: mvn package -DskipTests
        working-directory: streams

  deploy:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-test-package

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Package JAR
        run: mvn package -DskipTests
        working-directory: streams

      - name: Build Docker image
        run: docker build -t streams-api:latest .
        working-directory: streams